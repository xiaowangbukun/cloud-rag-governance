apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: cloud-governance
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: governance
            - name: POSTGRES_USER
              value: governance
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          args: ["-c", "shared_preload_libraries=vector"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "governance", "-d", "governance"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: cloud-governance
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: cloud-governance
type: Opaque
stringData:
  # 生产请用 ExternalSecret / SealedSecret / KMS 注入，严禁提交明文。
  # 占位符语义与 01-config.yaml 一致：保留该值部署即视为未完成密钥注入。
  POSTGRES_PASSWORD: "REPLACE_VIA_EXTERNAL_SECRET"
