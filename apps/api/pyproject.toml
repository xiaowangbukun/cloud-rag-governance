[project]
name = "cloud-rag-governance-api"
version = "1.0.0"
description = "内网多云资源治理与安全 RAG 归因平台 - API 服务"
requires-python = ">=3.11"
dependencies = [
    "cloud-rag-governance-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "httpx>=0.27",
    # multipart/form-data 解析：PDF 摄取接口（UploadFile）必需，
    # fastapi 不会自动带上它，缺了会在首次上传时抛运行时错误。
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "cryptography>=42",
    "passlib>=1.7",
    "numpy>=1.26",
    # S3/MinIO 上传（rg_api.backup）：只用 boto3 的 put/list/download，
    # 不引入其异步或高级特性；选择一个成熟客户端而不是手写 SigV4，
    # 是因为签名细节出错时表现为「403 但看不出原因」，排障成本极高。
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# 120 而非 100：ruff 的 E501 按 Unicode 显示宽度计数，CJK 字符记 2 列，
# 本仓库注释/文案大量中文，100 列下中文行极易误伤（实测 100 列 102 处告警、
# 120 列仅 5 处，且已全部修平）。选 120 是为了让 E501 能真正进 select 且零豁免。
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# W1 门禁实集：E4/E7/E9（pycodestyle 错误类）+ F（pyflakes）+ I（import 排序）。
# 遗留 UP/B/RUF 风格类问题（165 项基线中约 60 项）留待专项清理，不在本门禁范围内。
# E501 于 2026-10-22 实集：此前 line-length 配了 100 但 E5 未进 select，
# 超长行零告警（形同虚设）。现在行宽定 120 且存量告警已清零，规则真实生效。
select = ["E4", "E7", "E9", "E501", "F", "I"]
